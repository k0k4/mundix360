# Mundix360 WAF — ModSecurity v3 + OWASP CRS entrypoint.
# Ordering is explicit so Mundix tuning runs in the correct CRS phase.

# 1) Base ModSecurity engine config (distro default).
Include /etc/nginx/modsecurity.conf

# 2) Mundix overrides (engine ON, streaming-safe, limits).
Include /etc/nginx/modsec/mundix-overrides.conf

# 3) CRS setup (paranoia level, anomaly thresholds).
Include /etc/modsecurity/crs/crs-setup.conf

# 4) Mundix exclusions evaluated BEFORE the CRS attack rules.
Include /etc/nginx/modsec/mundix-before-crs.conf

# 5) OWASP Core Rule Set.
Include /usr/share/modsecurity-crs/rules/*.conf

# 6) Mundix tuning evaluated AFTER the CRS rules.
Include /etc/nginx/modsec/mundix-after-crs.conf
