#!/usr/sbin/nft -f
# =============================================================================
# Mundix Security 360 — base/bootstrap ruleset (ADAPTIVE, sem NIC hardcoded).
#
# Este arquivo é o /etc/nftables.conf de boot. Ele NÃO referencia nomes de
# interface fixos (ens18, etc.) — o appliance roda em qualquer hardware.
#
# Em runtime, o dashboard (fwmanage) renderiza /etc/nftables.d/mundix-managed.nft
# e SUBSTITUI as tabelas 'inet filter' / 'ip nat' abaixo. Até isso acontecer,
# esta base mantém a caixa GERENCIAVEL e segura em qualquer placa de rede.
#
# Principio anti-lockout: as portas de gestao (SSH 22 + painel 80/443) sao
# SEMPRE aceitas no input, para o operador nunca perder acesso.
# =============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP (diagnostico) — IPv4 e IPv6 (ND/RA sao obrigatorios p/ IPv6).
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept
        ip6 nexthdr ipv6-icmp accept

        # --- Lifelines de gestao (anti-lockout) ---
        tcp dport 22 accept
        tcp dport { 80, 443 } accept

        # DNS + DHCP servidos pelo dnsmasq aos clientes internos.
        udp dport 53 accept
        tcp dport 53 accept
        udp dport 67 accept

        limit rate 5/minute log prefix "NFT-INPUT-DROP: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop
        limit rate 5/minute log prefix "NFT-FORWARD-DROP: " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# Rulesets gerenciados em runtime pelo dashboard (managed + threat intel).
# Include com glob e NAO-fatal quando nao ha arquivos — uma caixa nova da boot
# limpa antes de o operador configurar qualquer regra.
include "/etc/nftables.d/*.nft"
