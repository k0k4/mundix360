# Mundix Security 360 — ModSecurity overrides.
# Aplicado DEPOIS do /etc/nginx/modsecurity.conf do distro, então estas
# diretivas vencem. O distro entrega o engine em DetectionOnly; aqui ativamos.

# Engine ATIVO (bloqueia, não só detecta).
SecRuleEngine On

# Manipulação de corpo segura para proxy/streaming + limites sãos.
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial

# Limites de PCRE para regras complexas do CRS não estourarem.
SecPcreMatchLimit 500000
SecPcreMatchLimitRecursion 500000

# Audit log lido pelo painel (app.services.waf).
SecAuditEngine RelevantOnly
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogParts ABFHZ
SecAuditLogType Serial
