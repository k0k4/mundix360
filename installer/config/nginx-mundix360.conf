# Mundix360 — WAF reverse proxy (ModSecurity v3 + OWASP CRS) in front of the
# FastAPI dashboard. nginx terminates on 127.0.0.1:8099 (the original address,
# drop-in); uvicorn moves to 127.0.0.1:8100.

# API rate limiting (brute-force / abuse mitigation). ~20 req/s per client with
# a generous burst for the SPA's bursty XHR.
limit_req_zone $binary_remote_addr zone=mundix_api:10m rate=20r/s;
limit_req_status 429;

# Esquema real visto pelo cliente: preserva o X-Forwarded-Proto encaminhado pela
# borda HTTPS (listener de gestão); senão usa o esquema desta conexão. Evita que
# o backend "ache" que é HTTP atrás do HTTPS (causa clássica de loop de redirect).
# Definido aqui (config sempre presente) para ser único em todo o nginx.
map $http_x_forwarded_proto $mundix_scheme {
    default $scheme;
    https   https;
}

upstream mundix_backend {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 127.0.0.1:8099;
    server_name _;

    # --- WAF ---
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # generous but bounded upload size
    client_max_body_size 16m;

    # hide nginx version
    server_tokens off;

    # --- AI streaming (SSE): must not be buffered ---
    location = /api/ai/chat/stream {
        proxy_pass http://mundix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mundix_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- backup import: bodies can run into the gigabytes ---
    location = /api/backup/import {
        client_max_body_size 2048m;
        proxy_read_timeout 300s;
        proxy_pass http://mundix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mundix_scheme;
    }

    # --- API ---
    location /api/ {
        limit_req zone=mundix_api burst=40 nodelay;
        proxy_pass http://mundix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mundix_scheme;
        proxy_read_timeout 180s;
    }

    # --- SPA + everything else (served by FastAPI) ---
    location / {
        proxy_pass http://mundix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mundix_scheme;
    }
}
