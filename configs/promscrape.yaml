global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: 'mundix-host'

  - job_name: 'victoriametrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:8428']

  - job_name: 'vector'
    scrape_interval: 15s
    static_configs:
      - targets: ['127.0.0.1:9598']

  - job_name: 'loki'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:3100']

  - job_name: 'clickhouse'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:9363']

  - job_name: 'akvorado-orchestrator'
    scrape_interval: 15s
    metrics_path: '/api/v0/metrics'
    static_configs:
      - targets: ['127.0.0.1:8080']

  - job_name: 'akvorado-inlet'
    scrape_interval: 15s
    metrics_path: '/api/v0/metrics'
    static_configs:
      - targets: ['127.0.0.1:8081']

  - job_name: 'akvorado-outlet'
    scrape_interval: 15s
    metrics_path: '/api/v0/metrics'
    static_configs:
      - targets: ['127.0.0.1:8082']

  - job_name: 'akvorado-console'
    scrape_interval: 15s
    metrics_path: '/api/v0/metrics'
    static_configs:
      - targets: ['127.0.0.1:8000']
