#!/usr/sbin/nft -f

# Mundix Security 360 - nftables base configuration
# Política: Default Deny (whitelist approach)

flush ruleset

# Definição de interfaces
define WAN1 = ens18
define LAN = ens19
define DMZ = ens20
define IOT = ens21

# Redes internas
define LAN_NET = 192.168.0.0/24
define DMZ_NET = 10.0.0.0/8
define IOT_NET = 172.16.0.0/16

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Permitir loopback
        iifname "lo" accept

        # Permitir tráfego estabelecido e relacionado
        ct state established,related accept

        # Permitir drop inválido
        ct state invalid drop

        # ICMP básico (diagnóstico)
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept

        # SSH apenas da interface de gestão (ajustar conforme necessário)
        iifname $LAN tcp dport 22 accept

        # DNS queries internas
        iifname { $LAN, $DMZ, $IOT } udp dport 53 accept
        iifname { $LAN, $DMZ, $IOT } tcp dport 53 accept

        # DHCP (para dnsmasq)
        iifname { $LAN, $DMZ, $IOT } udp sport 68 udp dport 67 accept

        # Log de tráfego bloqueado (amostragem)
        limit rate 5/minute log prefix "NFT-INPUT-DROP: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Permitir tráfego estabelecido e relacionado
        ct state established,related accept

        # Permitir drop inválido
        ct state invalid drop

        # LAN -> Internet (NAT será configurado depois)
        iifname $LAN oifname $WAN1 accept

        # DMZ -> Internet (acesso limitado, será refinado)
        iifname $DMZ oifname $WAN1 accept

        # ICMP entre zonas internas (diagnóstico)
        ip protocol icmp accept

        # Log de tráfego bloqueado
        limit rate 5/minute log prefix "NFT-FORWARD-DROP: " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;

        # Permitir tudo saindo (ajustar se necessário)
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # NAT para LAN -> Internet
        oifname $WAN1 ip saddr $LAN_NET masquerade
        oifname $WAN1 ip saddr $DMZ_NET masquerade
        oifname $WAN1 ip saddr $IOT_NET masquerade
    }
}
